# API HUB Panel standalone release

name: api-hub-panel

services:
  api-hub:
    image: ghcr.io/pinevu/uni-api-panel:latest
    container_name: api-hub-panel
    restart: unless-stopped
    ports:
      - "3000:8000"
    environment:
      TZ: Asia/Shanghai
      UNI_API_RUNTIME: rust
    volumes:
      - ./api.yaml:/home/api.yaml:ro
      - ./data:/home/data
